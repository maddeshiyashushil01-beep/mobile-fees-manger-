<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Reminder System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-graduation-cap"></i> FeeReminder</h1>
            <button onclick="openAddModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white text-sm px-3 py-1.5 rounded-lg shadow"><i class="fa-solid fa-plus"></i> Add</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white p-3 rounded-xl shadow-sm text-center"><p class="text-xs text-slate-500">Total</p><p id="totalCount" class="text-lg font-bold">0</p></div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center"><p class="text-xs text-rose-500">Pending</p><p id="pendingCount" class="text-lg font-bold text-rose-600">0</p></div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center"><p class="text-xs text-emerald-500">Collected</p><p id="collectedAmount" class="text-sm font-bold text-emerald-600 mt-1">₹0</p></div>
        </div>

        <div class="bg-white p-3 rounded-xl shadow-sm">
            <input type="text" id="searchInput" oninput="renderStudents()" placeholder="Search by name or phone..." class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg">
        </div>

        <div id="studentList" class="space-y-3"></div>
    </main>

    <!-- Modal Form -->
    <div id="studentModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-4 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between border-b pb-2">
                <h3 id="modalTitle" class="font-bold text-base">Add Student</h3>
                <button onclick="closeModal()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="studentForm" onsubmit="saveStudent(event)" class="space-y-3 text-sm">
                <input type="hidden" id="studentId">
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs mb-1">Name</label><input type="text" id="name" required class="w-full p-2 border rounded-lg"></div>
                    <div><label class="block text-xs mb-1">Section</label><input type="text" id="section" class="w-full p-2 border rounded-lg"></div>
                </div>
                <div><label class="block text-xs mb-1">Phone (eg. 919876543210)</label><input type="tel" id="phone" required class="w-full p-2 border rounded-lg"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs mb-1">Admission Date</label><input type="date" id="admission_date" class="w-full p-2 border rounded-lg"></div>
                    <div><label class="block text-xs mb-1">Payment Date</label><input type="date" id="payment_date" class="w-full p-2 border rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs mb-1">Month</label><input type="text" id="month" value="November" required class="w-full p-2 border rounded-lg"></div>
                    <div><label class="block text-xs mb-1">Year</label><input type="number" id="year" value="2026" required class="w-full p-2 border rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs mb-1">Amount (₹)</label><input type="number" id="amount" required class="w-full p-2 border rounded-lg"></div>
                    <div><label class="block text-xs mb-1">Status</label><select id="status" class="w-full p-2 border rounded-lg"><option value="Pending">Pending</option><option value="Paid">Paid</option></select></div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 py-2 rounded-lg">Cancel</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
